name: Build sing-box Rules

on:
  push:
    branches:
      - main
    paths:
      - "*.txt"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install sing-box
        run: |
          curl -fsSL https://sing-box.app/install.sh | sh
          sing-box version

      - name: Convert TXT to JSON
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          txt_files = sorted(Path(".").glob("*.txt"))

          if not txt_files:
              raise SystemExit("错误：仓库根目录没有找到任何 .txt 文件")

          Path("json").mkdir(exist_ok=True)
          Path("srs").mkdir(exist_ok=True)

          for txt_file in txt_files:
              domains = []

              for line in txt_file.read_text(encoding="utf-8").splitlines():
                  line = line.strip()

                  # 跳过空行和注释
                  if not line or line.startswith("#"):
                      continue

                  domains.append(line)

              output = {
                  "version": 5,
                  "rules": [
                      {
                          "domain_suffix": domains
                      }
                  ]
              }

              json_file = Path("json") / f"{txt_file.stem}.json"
              json_file.write_text(
                  json.dumps(output, ensure_ascii=False, indent=2),
                  encoding="utf-8"
              )

              print(f"{txt_file} -> {json_file} ({len(domains)} domains)")
          PY

      - name: Compile SRS
        run: |
          for json_file in json/*.json; do
            filename=$(basename "$json_file" .json)

            echo "编译 $json_file -> srs/${filename}.srs"

            sing-box rule-set compile \
              --output "srs/${filename}.srs" \
              "$json_file"
          done

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add json/ srs/

          if git diff --cached --quiet; then
            echo "没有需要提交的变化"
          else
            git commit -m "build: generate sing-box rule sets"
            git push
          fi
